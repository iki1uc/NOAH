<title>mainboard · mana · aura · zen · iki1uc</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04070c;color:#8aa8a0;
            font-family:'Consolas','Courier New',monospace;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}

  #kopf{position:fixed;top:24px;left:50%;transform:translateX(-50%);
        text-align:center;z-index:6;pointer-events:none}
  #kopf .marke{font-size:9px;letter-spacing:.55em;color:#2a4a3a;margin-bottom:8px}
  #kopf h1{font-size:clamp(16px,3.2vw,28px);font-weight:100;letter-spacing:.42em;
           color:#8cf0d0;text-shadow:0 0 40px rgba(140,240,208,.2)}
  #kopf .unter{font-size:9.5px;letter-spacing:.4em;color:#3a5a4a;margin-top:8px}

  /* ─── MAINBOARD · RECHTS ─────────────────────── */
  #board{position:fixed;top:50%;right:22px;transform:translateY(-50%);
         z-index:6;pointer-events:none;font-size:9.5px;
         letter-spacing:.22em;line-height:2;color:#3a5a4a;
         display:grid;gap:6px}
  #board .z{display:grid;grid-template-columns:60px 90px 46px;gap:8px;
            align-items:center}
  #board .k{color:#4a6a5a}
  #board .b{height:3px;background:#0a1c24;overflow:hidden}
  #board .b i{display:block;height:100%;transition:width .3s}
  #board .v{text-align:right;font-weight:bold}
  #board .mana .k{color:#7ce0a8}
  #board .mana .v{color:#7ce0a8}
  #board .mana .b i{background:#7ce0a8}
  #board .aura .k{color:#ffcc44}
  #board .aura .v{color:#ffcc44}
  #board .aura .b i{background:#ffcc44}
  #board .zen  .k{color:#5fc8ff}
  #board .zen  .v{color:#5fc8ff}
  #board .zen  .b i{background:#5fc8ff}
  #board .cpu  .k{color:#b388ff}
  #board .cpu  .v{color:#b388ff}
  #board .cpu  .b i{background:#b388ff}
  #board .ram  .k{color:#8cf0d0}
  #board .ram  .v{color:#8cf0d0}
  #board .ram  .b i{background:#8cf0d0}
  #board .gpu  .k{color:#f0d080}
  #board .gpu  .v{color:#f0d080}
  #board .gpu  .b i{background:#f0d080}

  /* ─── OHNMACHT · OBEN RECHTS ─────────────────── */
  #ohnmacht{position:fixed;top:22px;right:22px;z-index:6;
            pointer-events:none;font-size:9px;letter-spacing:.3em;
            text-align:right;line-height:2;color:#3a5a4a;
            transition:color .6s, text-shadow .6s}
  #ohnmacht.aktiv{color:#b388ff;
                  text-shadow:0 0 25px rgba(179,136,255,.6)}
  #ohnmacht .v{color:#8cf0d0}
  #ohnmacht.aktiv .v{color:#b388ff}

  /* ─── WIRBEL · STEUERUNG ─────────────────────── */
  #wirbel{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);
          z-index:6;display:flex;gap:8px;align-items:center;
          font-size:9px;letter-spacing:.3em;color:#3a5a4a}
  #wirbel button{background:transparent;border:1px solid #1a2a3a;
                 color:#3a5a4a;font-family:inherit;font-size:9px;
                 letter-spacing:.3em;padding:5px 12px;cursor:pointer;
                 transition:all .3s}
  #wirbel button:hover{color:#8cf0d0;border-color:#3a5a4a}
  #wirbel button.on{color:#f0d080;border-color:#f0d080}
  #wirbel .stufe{color:#8cf0d0;font-weight:bold;min-width:20px;
                 text-align:center}

  /* ─── SONNE · UNTEN ──────────────────────────── */
  #sonne{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
         z-index:6;pointer-events:none;text-align:center;
         font-size:9px;letter-spacing:.35em;color:#f0d080;
         line-height:2;opacity:.85}
  #sonne b{font-weight:400}

  /* ─── FUSS ───────────────────────────────────── */
  #fuss{position:fixed;bottom:14px;right:20px;font-size:9px;
        letter-spacing:.35em;color:#1e3328;z-index:6}
  #fuss b{color:#3a5a4a;font-weight:400}

  .ecke{position:fixed;width:14px;height:14px;z-index:998;
        pointer-events:none;opacity:.28;border-color:#8cf0d0}
  .ecke.ol{top:12px;left:12px;border-top:1px solid;border-left:1px solid}
  .ecke.or{top:12px;right:12px;border-top:1px solid;border-right:1px solid}
  .ecke.ul{bottom:12px;left:12px;border-bottom:1px solid;border-left:1px solid}
  .ecke.ur{bottom:12px;right:12px;border-bottom:1px solid;border-right:1px solid}

  /* ─── SPERRE ─────────────────────────────────── */
  #sperre{display:none}
  html[data-gate="gesperrt"] body > *:not(#sperre){display:none !important}
  html[data-gate="gesperrt"] #sperre{
    display:flex;position:fixed;inset:0;
    align-items:center;justify-content:center;flex-direction:column;
    background:#04070c;z-index:9999;text-align:center;padding:24px}
  #sperre .wort{font-size:clamp(22px,5vw,44px);font-weight:100;
                letter-spacing:.45em;color:#8cf0d0;margin-bottom:16px}
  #sperre .grund{font-size:10px;letter-spacing:.35em;color:#b388ff}

  @media(max-width:820px){
    #board{right:8px;font-size:8.5px}
    #board .z{grid-template-columns:48px 60px 36px}
    #ohnmacht{font-size:8px;top:14px;right:14px}
    #wirbel{font-size:8px}
    #wirbel button{font-size:8px;padding:4px 8px}
    #sonne{font-size:8px}
  }
</style>
</head>
<body>

<!-- 1 · TORWÄCHTER -->
<script>
  window.__EVO_GATE = { ok:false, grund:'wird geprüft', zeit:Date.now() };
</script>

<!-- 2 · DER WÄCHTER -->
<script src="security.js"></script>

<!-- 3 · TÜRSTEHER -->
<script>
  (function(){
    if(window.__EVO_WACHE === true){
      window.__EVO_GATE.ok = true;
      window.__EVO_GATE.grund = 'wächter aktiv';
    } else {
      window.__EVO_GATE.grund = 'security.js fehlt';
      document.documentElement.setAttribute('data-gate','gesperrt');
      document.addEventListener('DOMContentLoaded', () => {
        const g = document.getElementById('sperre-grund');
        if(g) g.textContent = window.__EVO_GATE.grund;
      });
    }
  })();
</script>

<canvas id="cv"></canvas>

<div id="kopf">
  <div class="marke">iki1uc · kader · mainboard</div>
  <h1>MANA · AURA · ZEN</h1>
  <div class="unter">hoch · breit · tiefe · tornado · sonne</div>
</div>

<div id="ohnmacht">
  <div>ohnmacht · <span class="v" id="ohm">ruhe</span></div>
  <div>peak · <span class="v" id="peak">0%</span></div>
</div>

<div id="board">
  <div class="z mana"><span class="k">MANA</span><span class="b"><i id="bMana"></i></span><span class="v" id="vMana">—</span></div>
  <div class="z aura"><span class="k">AURA</span><span class="b"><i id="bAura"></i></span><span class="v" id="vAura">—</span></div>
  <div class="z zen"><span class="k">ZEN</span><span class="b"><i id="bZen"></i></span><span class="v" id="vZen">—</span></div>
  <div class="z cpu"><span class="k">CPU</span><span class="b"><i id="bCpu"></i></span><span class="v" id="vCpu">—</span></div>
  <div class="z ram"><span class="k">RAM</span><span class="b"><i id="bRam"></i></span><span class="v" id="vRam">—</span></div>

</div>

<div id="wirbel">
  <button id="wAus" class="on">AUS</button>
  <button id="w1">1</button>

  <button id="w3">3</button>

</div>

  <b>☀ sonne · kann man nicht ausschalten</b>
</div>

  <div class="wort">GESPERRT</div>

</div>

<div class="ecke ol"></div>
<div class="ecke or"></div>
<div class="ecke ul"></div>
<div class="ecke ur"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   index.html · mainboard · iki1uc
   ═══════════════════════════════════════════════════════════
   Alle atome zusammen. Ein mainboard.
   Mana · Aura · Zen als abgeleitete werte.
   Tornado als kontrollierbare naturgewalt.
   Ohnmacht als peak.
   Sonne unausschaltbar.
   ═══════════════════════════════════════════════════════════ */

if(!window.__EVO_GATE || !window.__EVO_GATE.ok){
  console.log('mainboard · gesperrt');
  throw new Error('gate');
}

/* ─── ATOME LADEN ──────────────────────────────── */
let ATOM = null;
try { ATOM = (await import('./atom.js')).ATOM; } catch(e){}
let WAAGE = null;
try { WAAGE = (await import('./waage.js')).WAAGE; } catch(e){}

/* ─── ZEIT ─────────────────────────────────────── */
function setZeit(){
  const j = new Date();
  document.getElementById('zeit').textContent =
    String(j.getHours()).padStart(2,'0') + ':' +
    String(j.getMinutes()).padStart(2,'0');
}
setZeit();
setInterval(setZeit, 30000);

/* ─── CANVAS ───────────────────────────────────── */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cx, cy;
function resize(){
  const dpr = Math.min(devicePixelRatio, 2);
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = innerWidth / 2;
  cy = innerHeight / 2;
}
addEventListener('resize', resize);
resize();

/* ─── ZUSTAND ──────────────────────────────────── */
const S = {
  t: 0,
  wirbel: 0,          // 0..3 · kontrolle
  wirbelZiel: 0,
  peak: 0,            // 0..1 · peak-wert
  ohnmacht: false,
  ohnmachtZeit: 0,
  zeitSeitPeak: 0,
};

/* ─── WIRBEL STEUERUNG ─────────────────────────── */
function setWirbel(n){
  S.wirbelZiel = n;
  ['wAus','w1','w2','w3'].forEach(id => {
    document.getElementById(id).classList.remove('on');
  });
  document.getElementById(n === 0 ? 'wAus' : 'w' + n).classList.add('on');
  document.getElementById('stufe').textContent = n;
}
document.getElementById('wAus').addEventListener('click', () => setWirbel(0));
document.getElementById('w1').addEventListener('click', () => setWirbel(1));
document.getElementById('w2').addEventListener('click', () => setWirbel(2));
document.getElementById('w3').addEventListener('click', () => setWirbel(3));

/* ─── ZEICHNEN ─────────────────────────────────── */
function zeichne(){
  if(!window.__EVO_GATE.ok) return;
  requestAnimationFrame(zeichne);
  S.t += 16;

  /* Atom atmen */
  const z = ATOM ? ATOM.atme(S.t) : { o2: 0.6, co2: 0.6, h2o: 0.6, kern: 0.6, frieden: true, waage: {o2:0,co2:0,h2o:0,kern:0} };

  /* Wirbel sanft zum Ziel */
  S.wirbel += (S.wirbelZiel - S.wirbel) * 0.05;

  /* Peak berechnen — wie nah am maximum */
  const peak = Math.max(z.o2, z.co2, z.h2o, z.kern);
  S.peak = peak;

  /* Ohnmacht: wenn peak > 0.95 für mehr als 2 sekunden */
  if(peak > 0.95){
    S.zeitSeitPeak += 16;
    if(S.zeitSeitPeak > 2000 && !S.ohnmacht){
      S.ohnmacht = true;
      S.ohnmachtZeit = 3000;
    }
  } else {
    S.zeitSeitPeak = 0;
  }

  if(S.ohnmacht){
    S.ohnmachtZeit -= 16;
    if(S.ohnmachtZeit <= 0){
      S.ohnmacht = false;
      S.ohnmachtZeit = 0;
    }
  }

  /* Hintergrund */
  ctx.fillStyle = 'rgba(4,7,12,0.20)';
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  const Rmax = Math.min(innerWidth, innerHeight) * 0.30;
  const wirbelKraft = S.wirbel / 3;

  /* ─── TORNADO · der wirbel ────────────────── */
  if(S.wirbel > 0.05){
    const wind = 4 + S.wirbel * 6;
    for(let i = 0; i < wind; i++){
      const phase = (S.t * 0.0008 * (1 + S.wirbel * 0.4) + i / wind) % 1;
      const radius = Rmax * (1 - phase);
      const dreh = phase * Math.PI * 4 + S.t * 0.002;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, dreh, dreh + Math.PI * 0.6);
      ctx.strokeStyle = `rgba(140,240,208,${0.08 * (1 - phase) * (0.5 + wirbelKraft)})`;
      ctx.lineWidth = 1 + S.wirbel * 0.5;
      ctx.stroke();
    }
  }

  /* ─── BAND DES FRIEDENS ───────────────────── */
  ctx.beginPath();
  ctx.arc(cx, cy, Rmax, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(140,240,208,0.06)';
  ctx.lineWidth = 0.6;
  ctx.stroke();

  /* ─── VIER RINGE · o2 co2 h2o kern ─────────── */
  const ringe = [
    { wert: z.o2,   farbe:'#7ce0a8' },
    { wert: z.co2,  farbe:'#ffcc44' },
    { wert: z.h2o,  farbe:'#5fc8ff' },
    { wert: z.kern, farbe:'#b388ff' },
  ];
  ringe.forEach((r, i) => {
    const a0 = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const a1 = a0 + (Math.PI * 2) / 4 * r.wert;

    ctx.beginPath();
    ctx.arc(cx, cy, Rmax, a0, a1);
    ctx.strokeStyle = r.farbe;
    ctx.globalAlpha = 0.35 + r.wert * 0.5;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    const ex = cx + Math.cos(a1) * Rmax;
    const ey = cy + Math.sin(a1) * Rmax;
    ctx.beginPath();
    ctx.arc(ex, ey, 2.5 + r.wert * 2, 0, Math.PI * 2);
    ctx.fillStyle = r.farbe;
    ctx.globalAlpha = 0.7 + r.wert * 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  /* ─── KERN ─────────────────────────────────── */
  const hauch = S.ohnmacht ? 1.0 : (z.frieden ? 0.5 : 0.2);
  const kernGlut = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90 + S.peak * 40);
  kernGlut.addColorStop(0, `rgba(140,240,208,${hauch})`);
  kernGlut.addColorStop(0.5, `rgba(179,136,255,${hauch * 0.6})`);
  kernGlut.addColorStop(1, 'rgba(140,240,208,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 90 + S.peak * 40, 0, Math.PI * 2);
  ctx.fillStyle = kernGlut;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, 3 + z.kern * 4 + S.peak * 3, 0, Math.PI * 2);
  ctx.fillStyle = S.ohnmacht ? '#b388ff' : '#8cf0d0';
  ctx.fill();

  /* ─── INNENPULSE ───────────────────────────── */
  for(let i = 0; i < 4; i++){
    const ph = ((S.t * 0.00015) + i / 4) % 1;
    const r = Rmax * (1 - ph);
    if(r < 10) continue;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(140,240,208,${0.06 * (1 - ph) * (1 + wirbelKraft)})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  /* ─── SONNE · unten rechts · unausschaltbar ── */
  const sonneX = innerWidth - 60;
  const sonneY = innerHeight - 60;
  const sonneGlut = ctx.createRadialGradient(sonneX, sonneY, 0, sonneX, sonneY, 50);
  sonneGlut.addColorStop(0, 'rgba(240,208,128,0.7)');
  sonneGlut.addColorStop(0.4, 'rgba(240,208,128,0.2)');
  sonneGlut.addColorStop(1, 'rgba(240,208,128,0)');
  ctx.beginPath();
  ctx.arc(sonneX, sonneY, 50, 0, Math.PI * 2);
  ctx.fillStyle = sonneGlut;
  ctx.fill();

  /* ─── WERTE · BOARD ────────────────────────── */
  const setz = (id, x) => {
    const v = document.getElementById('v' + id);
    const b = document.getElementById('b' + id);
    if(v) v.textContent = (x * 100).toFixed(0) + '%';
    if(b) b.style.width  = (x * 100).toFixed(0) + '%';
  };

  /* Mana = o2 · Aura = co2 · Zen = h2o */
  setz('Mana', z.o2);
  setz('Aura', z.co2);
  setz('Zen',  z.h2o);

  /* CPU · RAM · GPU · abgeleitet */
  const cpu = 0.4 + z.kern * 0.4 + S.wirbel * 0.2;
  const ram = 0.5 + z.o2 * 0.3 + (S.wirbel > 0 ? 0.15 : 0);
  const gpu = 0.3 + z.kern * 0.4 + S.wirbel * 0.3;

  setz('Cpu', Math.min(1, cpu));
  setz('Ram', Math.min(1, ram));
  setz('Gpu', Math.min(1, gpu));

  /* Ohnmacht-Anzeige */
  const ohmEl = document.getElementById('ohnmacht');
  const ohmV = document.getElementById('ohm');
  const peakEl = document.getElementById('peak');
  peakEl.textContent = (S.peak * 100).toFixed(0) + '%';

  if(S.ohnmacht){
    ohmEl.classList.add('aktiv');
    ohmV.textContent = 'OHNMACHT';
  } else if(S.peak > 0.95){
    ohmEl.classList.remove('aktiv');
    ohmV.textContent = 'peak';
  } else {
    ohmEl.classList.remove('aktiv');
    ohmV.textContent = 'ruhe';
  }
}
zeichne();

/* ─── KONSOLE ───────────────────────────────────── */
console.log('');
console.log('  mainboard · iki1uc');
console.log('  ─────────────────────────────────');
console.log('  mana · aura · zen · als abgeleitete werte');
console.log('  wirbel · tornado · kontrollierbar (0-3)');
console.log('  ohnmacht · peak');
console.log('  sonne · kann man nicht ausschalten');
console.log('');
</script>
